name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: [lowest, highest]
        exclude:
          # The oldest supported Laravel and Filament releases predate PHP 8.5
          # and never claimed to run on it, so pinning to them under 8.5 tests
          # a combination nobody should assemble.
          - php: '8.5'
            dependencies: lowest

    name: PHP ${{ matrix.php }} — ${{ matrix.dependencies }} dependencies

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none
          # `zend.assertions` is settable only in php.ini, so PHPUnit asking for
          # it at runtime raises a warning that `failOnWarning` turns into a
          # failed build. Setting it here means the value already matches.
          ini-values: zend.assertions=1

      - name: Install dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1
        with:
          dependency-versions: ${{ matrix.dependencies }}

      # The suite runs with error_reporting=-1 and fails on any deprecation,
      # notice or warning raised by this package, so a new PHP release breaking
      # it is caught here rather than reported by a user.
      - name: Run tests
        run: vendor/bin/phpunit --display-phpunit-deprecations

  lint:
    runs-on: ubuntu-latest
    name: Code style

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      # Deliberately not the committed lock: a Pint release that changes what it
      # considers well-formed is worth hearing about, and the fix belongs in the
      # source rather than in a pin.
      - name: Install dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1
        with:
          dependency-versions: highest

      - name: Check code style
        run: vendor/bin/pint --test

  stylesheet:
    runs-on: ubuntu-latest
    name: Compiled stylesheet is current

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      # The theme compiles Filament's core stylesheet and scans its Blade views
      # for utilities, so the framework has to be installed before Tailwind can
      # resolve the import — and *which* version is installed changes the bytes
      # this job then compares. `locked` is what makes the comparison mean
      # something: without it every Filament patch release fails this job on a
      # repository nobody has touched. A framework upgrade instead arrives as a
      # commit that moves `composer.lock` and `resources/dist/mia.css` together.
      - name: Install PHP dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1
        with:
          dependency-versions: locked

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      # `npm ci` rather than `npm install`: the check below only means something
      # if the compiler is the same one the committed stylesheet was built
      # with, and only the lockfile guarantees that.
      - name: Install Node dependencies
        run: npm ci

      - name: Rebuild the stylesheet
        run: npm run build

      # `resources/dist` is committed so the package installs without a build
      # step. This fails the build if it was not regenerated after a CSS change.
      - name: Fail if the committed stylesheet is out of date
        run: |
          if ! git diff --quiet -- resources/dist; then
            echo "The compiled stylesheet is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- resources/dist
            exit 1
          fi
