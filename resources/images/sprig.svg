<!--
  The theme's empty-state illustration: a botanical sprig echoing the motif in
  the brand mark.

  Used as a CSS mask rather than an image, so it takes its colour from the
  theme's accent gradient and follows any palette the application configures.
  Keep this file and the inlined copy in `components/empty-state.css` in sync.
-->
