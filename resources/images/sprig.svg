        d="M26 106C44 92 62 70 78 38"
        stroke="black"
        stroke-width="2.4"
        stroke-linecap="round"
    />
    <g fill="black">
        <ellipse cx="28" cy="88" rx="13" ry="6.4" transform="rotate(-35 28 88)" />
        <ellipse cx="57" cy="91" rx="13" ry="6.4" transform="rotate(30 57 91)" />
        <ellipse cx="41" cy="72" rx="12" ry="6" transform="rotate(-38 41 72)" />
        <ellipse cx="69" cy="74" rx="12" ry="6" transform="rotate(26 69 74)" />
